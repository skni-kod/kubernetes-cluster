apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sknikod-backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  # tls used by default from traefik ns
  rules:
    - host: testapp.k8s.sknikod.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 80
